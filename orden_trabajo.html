<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Data - Orden de Trabajo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 900px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h1, h2 { color: #003366; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 15px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background-color: #003366; color: white; }
        .btn { background-color: #003366; color: white; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; margin-top: 15px; }
        .btn-add { background-color: #28a745; }
        .btn-remove { background-color: #dc3545; padding: 4px 8px; font-size: 12px; }
        .btn-pdf { background-color: #d92525; float: right; }
        .box { border: 1px solid #ccc; padding: 12px; border-radius: 6px; background-color: #fafafa; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            input, textarea, select { border: none; background: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>GRUPO DATA | Obras Eléctricas</h1>
        <a href="index.html" class="no-print" style="text-decoration: none; font-weight: bold; color: #003366;">← Volver a Presupuestos</a>
    </div>
    <h2>ORDEN DE TRABAJO</h2>
    
    <form id="otForm">
        <!-- Cabecera -->
        <div class="grid">
            <div>
                <label>Cliente:</label>
                <input type="text" id="cliente">
                <label style="margin-top:8px;">Obra:</label>
                <input type="text" id="obra">
                <label style="margin-top:8px;">Lugar:</label>
                <input type="text" id="lugar">
                <label style="margin-top:8px;">Descripción General:</label>
                <textarea id="descripcionGeneral" rows="2"></textarea>
            </div>
            <div>
                <label>OT N.°:</label>
                <input type="text" id="numOT" required>
                <label style="margin-top:8px;">Fecha de Emisión:</label>
                <input type="date" id="fechaEmision">
                <label style="margin-top:8px;">Fecha de Inicio / Finalización Prevista:</label>
                <div style="display:flex; gap:5px;">
                    <input type="date" id="fechaInicio">
                    <input type="date" id="fechaFin">
                </div>
                <label style="margin-top:8px;">Responsable / Supervisor:</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="responsable" placeholder="Responsable">
                    <input type="text" id="supervisor" placeholder="Supervisor">
                </div>
                <label style="margin-top:8px;">Prioridad:</label>
                <select id="prioridad">
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Trabajos -->
        <h3>Descripción de los Trabajos</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 8%;">Ítem</th>
                    <th>Descripción del trabajo</th>
                    <th style="width: 15%;">Cant.</th>
                    <th style="width: 15%;">Unidad</th>
                    <th class="no-print" style="width: 10%;">Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpoOT">
                <tr>
                    <td class="item-index">1</td>
                    <td><input type="text"></td>
                    <td><input type="number"></td>
                    <td><input type="text"></td>
                    <td class="no-print"><button type="button" class="btn btn-remove" onclick="eliminarFila(this)">X</button></td>
                </tr>
            </tbody>
        </table>

        <button type="button" class="btn btn-add no-print" onclick="agregarFila()">+ Agregar Ítem</button>

        <!-- Recursos, Instrucciones u Observaciones -->
        <div class="grid-3">
            <div class="box">
                <label>RECURSOS ASIGNADOS</label>
                <input type="text" placeholder="Personal técnico" style="margin-bottom:5px;">
                <input type="text" placeholder="Equipos / herramientas" style="margin-bottom:5px;">
                <input type="text" placeholder="Vehículo / transporte">
            </div>
            <div class="box">
                <label>INSTRUCCIONES ESPECIALES</label>
                <textarea rows="5"></textarea>
            </div>
            <div class="box">
                <label>OBSERVACIONES</label>
                <textarea rows="5"></textarea>
            </div>
        </div>

        <button type="button" class="btn btn-pdf no-print" onclick="window.print()">Generar / Guardar PDF</button>
    </form>
</div>

<script>
    function agregarFila() {
        const tbody = document.getElementById("cuerpoOT");
        const total = tbody.rows.length + 1;
        const fila = document.createElement("tr");
        fila.innerHTML = `
            <td class="item-index">${total}</td>
            <td><input type="text"></td>
            <td><input type="number"></td>
            <td><input type="text"></td>
            <td class="no-print"><button type="button" class="btn btn-remove" onclick="eliminarFila(this)">X</button></td>
        `;
        tbody.appendChild(fila);
    }

    function eliminarFila(btn) {
        btn.parentElement.parentElement.remove();
        document.querySelectorAll("#cuerpoOT tr").forEach((tr, i) => {
            tr.querySelector(".item-index").textContent = i + 1;
        });
    }
</script>

</body>
</html>
