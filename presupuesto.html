<!-- Librerías requeridas en el <head> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Botón a añadir en la barra de acciones -->
<button class="btn" style="background:#4285F4; color:white;" onclick="guardarEnDrive()">
    <i class="fa-brands fa-google-drive"></i> Guardar en Google Drive
</button>

<script>
  // Reemplaza con tu Client ID de Google Cloud
  const CLIENT_ID = 'TU_CLIENT_ID.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/drive.file';

  let tokenClient;
  let accessToken = null;

  // Inicializar Google Auth
  window.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (tokenResponse) => {
        if (tokenResponse.access_token) {
          accessToken = tokenResponse.access_token;
          subirPDFADrive();
        }
      },
    });
  };

  function guardarEnDrive() {
    if (!accessToken) {
      // Solicita inicio de sesión si no hay token activo
      tokenClient.requestAccessToken();
    } else {
      subirPDFADrive();
    }
  }

  async function subirPDFADrive() {
    const elemento = document.querySelector('.pdf-container');
    const numPresupuesto = document.getElementById('in-numero').value || 'Sin_Numero';
    const nombreArchivo = `Presupuesto_${numPresupuesto}.pdf`;

    // 1. Generar Blob del PDF
    const opciones = {
      margin: 10,
      filename: nombreArchivo,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    const pdfWorker = html2pdf().set(opciones).from(elemento).toPdf();
    const pdfBlob = await pdfWorker.output('blob');

    // 2. Preparar los metadatos y cuerpo para Google Drive API
    const metadata = {
      name: nombreArchivo,
      mimeType: 'application/pdf'
    };

    const formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    formData.append('file', pdfBlob);

    // 3. Subir archivo mediante fetch
    try {
      const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
        body: formData
      });

      if (response.ok) {
        alert('¡Presupuesto guardado con éxito en tu Google Drive!');
      } else {
        alert('Error al guardar en Google Drive.');
      }
    } catch (error) {
      console.error(error);
      alert('Ocurrió un problema al conectar con Google Drive.');
    }
  }
</script>
